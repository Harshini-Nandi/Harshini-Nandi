name: Update profile README

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (UTC) - change to "0 0 * * *" for daily
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["assets/me.jpeg", "generate_ascii.py", "update_readme.py", "config.json"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Regenerate ASCII portrait (only if missing)
        run: test -f assets/ascii.txt || python generate_ascii.py

      - name: Build README with fresh stats
        env:
          # Add a classic PAT named GH_PAT (scope: read:user) to also count private contributions.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python update_readme.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ascii.txt
          git diff --cached --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push
